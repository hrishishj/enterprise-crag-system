name: security
on:
  push: { branches: [master] }
  pull_request:
  schedule: [{ cron: "0 6 * * 1" }]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[legacy]" pip-audit
      - name: Audit dependencies (informational until pinned in Phase 2)
        run: .venv/bin/pip-audit || true
