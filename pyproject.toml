[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crag"
version = "0.1.0"
description = "Cite-or-abstain corrective RAG for finance and legal documents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Dependencies of the frozen baseline in legacy/server (used only by tests/legacy).
legacy = [
  "langchain>=0.2.0",
  "langchain-openai>=0.1.0",
  "langchain-community>=0.2.0",
  "langchain-text-splitters>=0.2.0",
  "chromadb>=0.5.0",
  "openai>=1.30.0",
  "pdfplumber>=0.11.0",
  "tiktoken>=0.7.0",
  "python-dotenv>=1.0.0",
  "langgraph>=0.1.0",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
  "reportlab>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs live external services"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501", "RUF001", "RUF012"]
"evals/corpus.py" = ["E501"]  # verbatim contract text
"evals/metrics.py" = ["RUF001"]  # normalising typographic quotes is the point

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.importlinter]
root_package = "crag"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["crag.apps", "crag.pipelines", "crag.adapters", "crag.core", "crag.domain"]
